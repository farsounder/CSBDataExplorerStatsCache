# Build and push API + ETL images to Artifact Registry on push to main.
# Required repo secrets: GCP_PROJECT_ID, GCP_SA_KEY (JSON key for a service account
# with roles/artifactregistry.writer, or at least Storage Object Viewer + write to the repo).
name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-central1
  REPO: noaa-csb-analytics

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push API
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/api:${{ github.sha }}
          docker build -f Dockerfile.api -t "$IMAGE" -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/api:latest .
          docker push "$IMAGE"
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/api:latest

      - name: Build and push ETL
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/etl:${{ github.sha }}
          docker build -f Dockerfile.etl -t "$IMAGE" -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/etl:latest .
          docker push "$IMAGE"
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/etl:latest
