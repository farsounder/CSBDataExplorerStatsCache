[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "etl*", "api*"]

[project]
name = "noaa-csb-analytics"
version = "0.1.0"
description = "NOAA Crowdsourced Bathymetry analytics pipeline and API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "duckdb",
    "boto3",
    "pydantic-settings",
    "python-dotenv",
    "google-cloud-storage",
    "gcsfs",
    "httpx",
    "pyarrow>=23.0.1",
]
[project.optional-dependencies]
gcp = ["google-cloud-secret-manager", "google-cloud-storage"]
